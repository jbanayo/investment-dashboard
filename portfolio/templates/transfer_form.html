{% extends "base.html" %}{% block content %}
<div class="head"><div><h1>Record transfer</h1><p class="sub">External transfers are capital movement. Add a counterparty platform to create a matched internal pair.</p></div><a class="btn" href="{{ url_for('transactions') }}">Back</a></div>
<form class="card form-grid" method="post"><label class="field">Platform<input class="input" list="platforms" required name="platform" value="{{ request.form.platform or '' }}"><datalist id="platforms">{% for platform in known_platforms %}<option value="{{ platform }}">{% endfor %}</datalist></label><label class="field">Direction<select class="input" required name="direction"><option value="in">Money in</option><option value="out">Money out</option></select></label><label class="field">Transfer date<input class="input" type="date" required name="transfer_date" value="{{ request.form.transfer_date or '' }}"></label><label class="field">Amount<input class="input" type="number" step="any" min="0" required name="amount" value="{{ request.form.amount or '' }}"></label><label class="field">Currency<input class="input" maxlength="3" required name="currency" value="{{ request.form.currency or '' }}"></label><label class="field">Counterparty platform <span class="sub">optional</span><input class="input" list="platforms" name="counterparty_platform" value="{{ request.form.counterparty_platform or '' }}"></label><label class="field">Counterparty currency <span class="sub">optional</span><input class="input" maxlength="3" name="counterparty_currency" value="{{ request.form.counterparty_currency or '' }}"></label><label class="field full">Note <span class="sub">optional</span><textarea class="input" name="note" rows="3">{{ request.form.note or '' }}</textarea></label><div class="actions full"><a class="btn" href="{{ url_for('transactions') }}">Cancel</a><button class="btn primary">Record transfer</button></div></form>
{% endblock %}
