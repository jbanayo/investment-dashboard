{% extends "base.html" %}{% block content %}
<div class="head"><div><h1>Record fee</h1><p class="sub">The amount debits the selected platform's cash instrument.</p></div><a class="btn" href="{{ url_for('transactions') }}">Back</a></div>
<form class="card form-grid" method="post"><label class="field">Platform<input class="input" list="platforms" required name="platform" value="{{ request.form.platform or '' }}"><datalist id="platforms">{% for platform in known_platforms %}<option value="{{ platform }}">{% endfor %}</datalist></label><label class="field">Fee date<input class="input" type="date" required name="fee_date" value="{{ request.form.fee_date or '' }}"></label><label class="field">Amount<input class="input" type="number" step="any" min="0" required name="amount" value="{{ request.form.amount or '' }}"></label><label class="field">Currency<input class="input" maxlength="3" required name="currency" value="{{ request.form.currency or '' }}"></label><label class="field full">Related instrument <span class="sub">optional</span><select class="input" name="related_instrument_id"><option value="">None</option>{% for instrument in instruments %}<option value="{{ instrument.id }}">{{ instrument.name }} · {{ instrument.platform }}</option>{% endfor %}</select></label><label class="field full">Note <span class="sub">optional</span><textarea class="input" name="note" rows="3">{{ request.form.note or '' }}</textarea></label><div class="actions full"><a class="btn" href="{{ url_for('transactions') }}">Cancel</a><button class="btn primary">Record fee</button></div></form>
{% endblock %}
