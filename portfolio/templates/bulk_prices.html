{% extends "base.html" %}{% block content %}<div class="head"><div><h1>Bulk manual price entry</h1><p class="sub">Leave a price blank to leave that instrument unchanged.</p></div><a class="btn" href="{{ url_for('prices') }}">Back</a></div><form class="card" method="post"><label class="field" style="max-width:220px;margin-bottom:12px">Price date<input class="input" type="date" required name="price_date" value="{{ request.form.price_date or '' }}"></label><div class="table-wrap"><table><thead><tr><th>Instrument</th><th>Currency</th><th>Price</th></tr></thead><tbody>{% for instrument in instruments %}<tr><td>{{ instrument.name }}<br><span class="sub">{{ instrument.platform }}</span></td><td><input class="input" style="width:80px" name="currency_{{ instrument.id }}" value="{{ instrument.native_currency }}"></td><td><input class="input" style="width:140px" type="number" step="any" min="0" name="price_{{ instrument.id }}" value="{{ request.form['price_' ~ instrument.id] or '' }}" aria-label="Price for {{ instrument.name }}"></td></tr>{% endfor %}</tbody></table></div><div class="actions" style="margin-top:16px"><a class="btn" href="{{ url_for('prices') }}">Cancel</a><button class="btn primary">Save prices</button></div></form>{% endblock %}
