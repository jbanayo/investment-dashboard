{% extends "base.html" %}{% block content %}<div class="head"><div><h1>Add manual price</h1><p class="sub">Changing an existing manual price keeps a revision record.</p></div><a class="btn" href="{{ url_for('prices') }}">Back</a></div><form class="card form-grid" method="post"><label class="field full">Instrument<select class="input" required name="instrument_id">{% for instrument in instruments %}<option value="{{ instrument.id }}">{{ instrument.name }} · {{ instrument.platform }} · {{ instrument.native_currency }}</option>{% endfor %}</select></label><label class="field">Price date<input class="input" type="date" required name="price_date" value="{{ request.form.price_date or '' }}"></label><label class="field">Price<input class="input" type="number" step="any" min="0" required name="price" value="{{ request.form.price or '' }}"></label><label class="field">Currency<input class="input" maxlength="3" required name="currency" value="{{ request.form.currency or '' }}"></label><div class="actions full"><a class="btn" href="{{ url_for('prices') }}">Cancel</a><button class="btn primary">Save price</button></div></form>{% endblock %}
