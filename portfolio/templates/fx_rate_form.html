{% extends "base.html" %}{% block content %}<div class="head"><div><h1>Add USD/PHP rate</h1><p class="sub">One USD equals this many PHP. Changes retain a revision record.</p></div><a class="btn" href="{{ url_for('prices') }}">Back</a></div><form class="card form-grid" method="post"><label class="field">Rate date<input class="input" type="date" required name="rate_date" value="{{ request.form.rate_date or '' }}"></label><label class="field">USD/PHP rate<input class="input" type="number" step="any" min="0" required name="rate" value="{{ request.form.rate or '' }}"></label><div class="actions full"><a class="btn" href="{{ url_for('prices') }}">Cancel</a><button class="btn primary">Save rate</button></div></form>{% endblock %}
