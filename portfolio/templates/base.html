<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Dashboard</title>
  <style>
    :root { color-scheme: light; --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --border:rgba(11,11,11,.1); --accent:#2a78d6; --down:#d03b3b; }
    * { box-sizing:border-box } body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:960px; margin:auto; padding:24px 16px 64px } h1 { font-size:20px; margin:0 } .head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px } .sub { color:var(--ink-2); margin:4px 0 0 }.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px }.btn { display:inline-block; padding:7px 12px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; font:inherit; text-decoration:none; cursor:pointer }.btn.primary { background:var(--accent); color:white; border-color:var(--accent) }.btn.danger { color:var(--down) } table { width:100%; border-collapse:collapse } th,td { border-bottom:1px solid var(--border); padding:10px 8px; text-align:left } th { color:var(--muted); font-size:11.5px; text-transform:uppercase } .actions { display:flex; gap:8px }.filters,.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:16px }.full { grid-column:1/-1 }.field { display:grid; gap:4px; color:var(--ink-2); font-weight:550 }.input { min-height:34px; border:1px solid var(--border); border-radius:8px; padding:7px 10px; background:var(--page); font:inherit; color:var(--ink) }.flash { padding:10px 12px; border-radius:8px; margin-bottom:12px; background:var(--surface-2) }.flash.error { color:var(--down) } .foot { color:var(--muted); font-size:12px; margin-top:16px } @media(max-width:560px){.head{align-items:flex-start;flex-direction:column}.filters,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.table-wrap{overflow:auto}}
  </style>
</head>
<body><main>
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main></body>
</html>
